<!DOCTYPE html>
<html>
	<head>
		<title>List</title>
	</head>
	<body>

	<ul style="list-style-type:disc">
		<li>Coffee</li>
		<ol>
			<li value="1">Americano</li>
		</ol>
		<dd>Black Coffee</dd>

		<li>Milk</li>
		<ol>
			<li value="1">Bear Brand</li>
		</ol>
		<dd>Alaska</dd>

		<li>Milk Tea</li>
		<ol>
			<li value="1">Brown Sugar</li>
		</ol>
		<dd>Matcha Latte</dd>
	</ul>

	<ol start="5">
		<li>Coffee</li>
		<ul style="list-style-type:square">
			<li>Americano</li>
		</ul>
		<dd>Black Coffee</dd>

		<li>Milk</li>
		<ul style="list-style-type:square">
			<li>Bear Brand</li>
		</ul>
		<dd>Alaska</dd>

		<li>Milk Tea</li>
		<ul style="list-style-type:square">
			<li>Brown Sugar</li>
		</ul>
		<dd>Matcha Latte</dd>
	</ol>

	</body>
</html>
